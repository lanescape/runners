name: CI

# On pull requests, and from cd.yml, as its checks before it deploys
# (specs/0004-deployment.md, CI and CD).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A pull request's newer push cancels its older checks. Called from cd.yml,
# each run's checks are its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    # The organization's own pull requests, and its pushes to main through
    # cd.yml, run on Blacksmith. A fork's pull request runs on GitHub's
    # runners, since nothing in CI needs anything of ours.
    runs-on: ${{ github.repository_owner_id == '303994381' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-2vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files aren't formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        run: go test -race ./...

  # The actions run inside consumers' jobs on other platforms too, where
  # paths, shells, signals and file locking differ, so their tests also run
  # natively on Linux arm64 and macOS arm64 (specs/0007-actions.md, Code
  # and tests); the Go job runs them on Linux amd64.
  actions:
    name: Test the actions (${{ matrix.platform }})
    runs-on: ${{ github.repository_owner_id == '303994381' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.blacksmith || matrix.github }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            blacksmith: blacksmith-4vcpu-ubuntu-2604-arm
            github: ubuntu-26.04-arm
          - platform: macos-arm64
            blacksmith: blacksmith-12vcpu-macos-26
            github: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: |
          go vet ./actions/...
          go vet -tags e2e ./actions/...
      - name: go test
        run: go test -race ./actions/...

  checkout:
    name: Check out with checkout (${{ matrix.platform }})
    # The checkout action itself, as a consumer's job runs it, for the run's
    # own commit. A contribution's checkout needs a pull_request_target
    # run, so the tests cover it up to actions/checkout. disk, cache
    # and save-cache aren't run here, since they call the runner service,
    # which CI never relies on; their tests run them against its emulators.
    runs-on: ${{ github.repository_owner_id == '303994381' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.blacksmith || matrix.github }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            blacksmith: blacksmith-2vcpu-ubuntu-2604
            github: ubuntu-26.04
          - platform: macos-arm64
            blacksmith: blacksmith-12vcpu-macos-26
            github: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/checkout
      - name: The checkout is the run's commit
        env:
          WANT: ${{ github.sha }}
        run: |
          have="$(git rev-parse HEAD)"
          if [ "$have" != "$WANT" ]; then
            echo "::error::checked out $have, not $WANT"
            exit 1
          fi

  build:
    name: Build every action for every platform
    runs-on: ${{ github.repository_owner_id == '303994381' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-2vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        # Every action's program, for every platform runners use, as the
        # actions build them: pure Go, with CGO off.
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            for dir in actions/*/action.yml; do
              program="${dir%/action.yml}"
              echo "$program for $platform"
              CGO_ENABLED=0 GOOS="${platform%/*}" GOARCH="${platform#*/}" \
                go build -trimpath -o "$RUNNER_TEMP/$platform/$program" "./$program"
            done
          done

  terraform:
    name: Terraform
    runs-on: ${{ github.repository_owner_id == '303994381' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-2vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform
        # The latest release, and Infrastructure Manager's newest, which
        # applies infra/. Checksums from HashiCorp's signed SHA256SUMS.
        run: |
          set -euo pipefail
          install() {
            local version=$1 sha256=$2 dir="$RUNNER_TEMP/terraform-$1"
            curl -fsSLo "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/$version/terraform_${version}_linux_amd64.zip"
            echo "$sha256  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
            mkdir -p "$dir"
            unzip -q -o "$RUNNER_TEMP/terraform.zip" -d "$dir"
            rm "$RUNNER_TEMP/terraform.zip"
          }
          install 1.17.1 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061
          install 1.5.7 c0ed7bc32ee52ae255af9982c8c88a7a4c610485cf1d55feeb037eab75fa082c
      - name: Refuse what infra/, bootstrap/ and tools/ may not hold
        run: infra/check.sh
      - name: terraform fmt
        run: '"$RUNNER_TEMP/terraform-1.17.1/terraform" fmt -check -diff -recursive infra bootstrap tools'
      - name: terraform validate
        run: |
          set -euo pipefail
          validate() {
            local tf="$RUNNER_TEMP/terraform-$1/terraform" dir=$2
            echo "Terraform $1, $dir/"
            rm -rf "$dir/.terraform"
            "$tf" -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            "$tf" -chdir="$dir" validate
          }
          validate 1.17.1 bootstrap
          validate 1.17.1 tools
          validate 1.17.1 infra
          validate 1.5.7 infra
