name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    # The organization's own pull requests run on Blacksmith. A fork's runs
    # on GitHub's runners, since nothing in CI needs anything of ours.
    runs-on: ${{ github.repository_owner_id == '303994381' && github.event.pull_request.head.repo.full_name == github.repository && 'blacksmith-2vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files aren't formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        run: go test -race ./...
